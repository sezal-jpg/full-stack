name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: exp-3.2.1/package.json

      - name: Install dependencies
        working-directory: ./exp-3.2.1
        run: npm install --legacy-peer-deps

      - name: Run tests
        working-directory: ./exp-3.2.1
        run: npm test

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./exp-3.2.1
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/react-docker-app:latest
            ${{ secrets.DOCKER_USERNAME }}/react-docker-app:${{ github.sha }}

      - name: Send Slack notification
        if: success()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "✅ Deployment successful! Image pushed: ${{ secrets.DOCKER_USERNAME }}/react-docker-app:${{ github.sha }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}